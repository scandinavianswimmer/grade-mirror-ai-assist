#   select cron.schedule(
#     'aita-privacy-nightly', '0 3 * * *',
#     $$ select net.http_post(
#          url := 'https://<project>.functions.supabase.co/privacy-tasks',
#          headers := jsonb_build_object('x-cron-secret', '<CRON_SECRET>')
#        ); $$
#   );
