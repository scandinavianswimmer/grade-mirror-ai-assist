# Local CLI identifier only. A remote project must be selected explicitly with
# `--project-ref` or `supabase link` after organization and cost approval.
project_id = "mr-selby"

# ── Edge Functions ────────────────────────────────────────────────────────────
# All functions verify the caller's JWT at the gateway by default (verify_jwt = true).
# privacy-tasks is the exception: it is service-role/cron only and must NOT accept user JWTs —
# it is gated by the x-cron-secret header (CRON_SECRET) in code.
# Historical `generate-grading-feedback` and `test-ai-grading` source is intentionally retained,
# but both entry points are retired and excluded from the reviewed CI runtime manifest.
[functions.grade-submission]
# Deployed with --no-verify-jwt so the internal Cloud Run worker can call it without a user JWT.
# Auth IS enforced in code: getUserFromJWT for normal calls, OR a matching INTERNAL_GRADE_SECRET
# header for the worker path. config now matches the deployed reality (was a silent drift).
verify_jwt = false

[functions.ingest-document]
verify_jwt = true

[functions.build-style-profile]
verify_jwt = true

[functions.record-feedback-usage]
verify_jwt = true

[functions.delete-data]
verify_jwt = true   # right-to-erasure; RLS-scoped deletes of the caller's own data only

[functions.stripe-webhook]
verify_jwt = false   # Stripe cannot present a Supabase JWT; HMAC-SHA256 signature is the auth boundary

[functions.privacy-tasks]
verify_jwt = false   # gated by CRON_SECRET in code; never expose without that header

# ── Storage ──────────────────────────────────────────────────────────────────
[storage]
enabled = true

# ── Scheduled jobs (run privacy-tasks nightly via pg_cron + pg_net) ────────────
