# Phase 14 (DEPLOY-02) + S2-KR3 / MEDIUM-13: quality is a CI gate.
#
# `quality-gate` is the BLOCKING, DETERMINISTIC, SECRET-FREE proof/regression suite that runs on every
# push and PR: lint → typecheck → full vitest (incl. the grading-trust regressions + eval calibration/judge
# unit tests) → production build → the eval DRY-RUNS (mock judge + dataset/prompt assembly) → the
# auto-finalize calibration gate. Any non-zero exit fails the build. No secret is referenced here, so
# external-contributor PRs can run it.
#
# `live-judge` is a SEPARATE, NON-BLOCKING job (nightly schedule + manual dispatch) that runs the REAL
# Gemini judge against the GEMINI_API_KEY repo secret. It never gates a PR. The founder must add the
# secret for it to run (see eval/README.md).
#
# `deploy-functions` ships edge functions on merge to main only when the Supabase credentials are
# present AND the separate SUPABASE_DEPLOY_ENABLED repository variable is explicitly set to `true`.
name: ci

on:
  push:
    branches: [main, aita-production-build]
  pull_request:
  schedule:
    # Nightly live-judge run (UTC). Non-blocking; only runs if GEMINI_API_KEY is configured.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  # ── BLOCKING quality gate (deterministic, no secrets) ──────────────────────────────────────────
  quality-gate:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Typecheck Supabase Edge Functions (Deno)
        shell: bash
        run: |
          set -euo pipefail
          function_entries=()
          while IFS= read -r entry; do
            function_entries+=("$entry")
          done < <(
            find supabase/functions \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name index.ts \
              -not -path '*/_shared/*' \
              -print | sort
          )
          if [[ ${#function_entries[@]} -eq 0 ]]; then
            echo "No deployable Supabase Edge Functions were found." >&2
            exit 1
          fi
          deno check --node-modules-dir=auto --frozen "${function_entries[@]}"

      - name: Unit + regression tests (vitest — grading-trust + eval suites)
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Public-route accessibility gate (axe + WCAG 2.2 checks)
        run: npm run a11y:ci

      - name: Eval dry-run — Gemini-judge voice-fidelity contract (mock scorer, no key)
        run: npm run eval:dry

      - name: Eval dry-run — reference dataset + prompt assembly
        run: npm run eval:dry:dataset

      - name: Auto-finalize calibration gate (<5% false-finalize on holdout)
        run: npm run eval:calibrate

  # ── Edge-function deploy (explicit kill switch + credentials + merge to main) ──────────────────
  deploy-functions:
    needs: quality-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: deploy-config
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DEPLOY_ENABLED: ${{ vars.SUPABASE_DEPLOY_ENABLED }}
        run: |
          if [[ "$SUPABASE_DEPLOY_ENABLED" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment is disabled; set the SUPABASE_DEPLOY_ENABLED repository variable to 'true' to enable it."
          elif [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_REF" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment was explicitly enabled, but its credentials are incomplete." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.deploy-config.outputs.configured == 'true' }}
      - uses: supabase/setup-cli@v1
        if: ${{ steps.deploy-config.outputs.configured == 'true' }}
        with:
          version: latest
      - name: Deploy edge functions
        if: ${{ steps.deploy-config.outputs.configured == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          # This reviewed manifest is the production deployment boundary. Repository discovery
          # below must match it exactly, so a new experimental/debug function cannot ship merely
          # because it has a top-level index.ts. `_shared` helpers are bundled, never deployed.
          runtime_functions=(
            build-style-profile
            create-class
            delete-data
            generate-grading-feedback
            generate-style-summary
            grade-enqueue
            grade-submission
            increment-feedback-count
            ingest-document
            privacy-tasks
            rebuild-exemplars
            record-feedback-usage
            stripe-checkout
            stripe-portal
            stripe-webhook
            test-ai-grading
          )

          discovered_functions=()
          while IFS= read -r entry; do
            fn="$(basename "$(dirname "$entry")")"
            if [[ ! "$fn" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Invalid top-level function name in repository: $fn" >&2
              exit 1
            fi
            discovered_functions+=("$fn")
          done < <(
            find supabase/functions \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name index.ts \
              -not -path '*/_shared/*' \
              -print | sort
          )

          if [[ ${#discovered_functions[@]} -eq 0 ]]; then
            echo "No deployable Supabase Edge Functions were found." >&2
            exit 1
          fi

          for fn in "${runtime_functions[@]}"; do
            if [[ ! "$fn" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Invalid function name in runtime manifest: $fn" >&2
              exit 1
            fi
          done

          manifest_inventory="$(printf '%s\n' "${runtime_functions[@]}" | LC_ALL=C sort)"
          repository_inventory="$(printf '%s\n' "${discovered_functions[@]}" | LC_ALL=C sort)"
          if [[ "$manifest_inventory" != "$repository_inventory" ]]; then
            echo "Runtime manifest does not exactly match top-level Edge Function entry points." >&2
            diff -u \
              <(printf '%s\n' "$manifest_inventory") \
              <(printf '%s\n' "$repository_inventory") || true
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          for fn in "${runtime_functions[@]}"; do
            case "$fn" in
              grade-submission|stripe-webhook|privacy-tasks)
                # These functions authenticate in code: the internal grading secret, Stripe's
                # signature, and CRON_SECRET respectively. privacy-tasks is only deployed here;
                # its nightly invocation remains owned by the database scheduler.
                supabase functions deploy "$fn" --no-verify-jwt
                ;;
              *)
                supabase functions deploy "$fn"
                ;;
            esac
          done

  # ── NON-BLOCKING live judge (nightly schedule + manual dispatch; founder-gated on the secret) ───
  # Runs the REAL Gemini judge. NEVER gates a PR. Skips cleanly when GEMINI_API_KEY is not configured.
  live-judge:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Live Gemini-judge voice-fidelity run (requires GEMINI_API_KEY secret)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run eval:live
      - name: No key configured — skipping live judge
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: |
          echo "GEMINI_API_KEY is not set; the live judge cannot run."
          echo "Add the repo secret (Settings → Secrets → Actions) to enable the nightly/dispatch live judge."
          echo "The blocking PR gate (quality-gate) stays deterministic and secret-free regardless."
